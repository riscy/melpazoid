[project]
name = "melpazoid"
requires-python = ">=3.10"
dynamic = ["authors", "description", "license", "version"]
dependencies = []

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
quote-style = "preserve"
preview = true
